# PostgreSQL 18 설정 — io_uring 활성화 및 성능 튜닝
# memorIN-backend/infra/postgres/postgresql.conf 를 그대로 가져온 운영판이다.
# 검증 배경은 memorIN-backend 저장소의 docs/pg18-io_uring-검증.md 참고.

# ─── 연결 ──────────────────────────────────────────────────────
listen_addresses = '*' # 모든 ip에서 연결 허용(기본값은 localhost, 도커 환경에서는 다른 컨테이너도 접근해야되니까 *)
max_connections = 100

# ─── io_uring (PG18 신규, 비동기 I/O) ─────────────────────────
# 이 서버가 실제 Linux 호스트라면 io_uring이 seccomp에 막히지 않는다 — 활성화 전
# memorIN-backend/docs/pg18-io_uring-검증.md 로 안전성을 확인한 뒤 아래 값을 io_uring으로 바꾼다.
io_method = worker      # 기본값(워커 스레드). io_uring 미검증 상태의 안전한 출발점

# ─── 메모리 (컨테이너 환경에 맞게 조정 필요) ───────────────────
# shared_buffers : postgres가 사용할 메모리양, RAM의 1/4 정도가 적절하다.
# work_mem : 쿼리당 사용할 메모리양, 병렬 처리 시 각 프로세스가 사용한다.
# maintenance_work_mem : 인덱스 생성, 백업 등 유지보수 작업 시 사용할 메모리양
# 도커 컨테이너는 가상환경이므로 RAM의 절반보다 적게 잡는 게 좋음
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB

# ─── WAL / 체크포인트 ──────────────────────────────────────────
# 데이터 바꾸기 전에 로그 파일에 먼저 기록, (write ahead log)
# 데이터 유실을 막고 replication 등 가능
wal_level = replica
# 체크포인트가 너무 자주 일어나면 디스크 I/O가 심해지니까 
# 체크포인트 빈도 조절
# 체크포인트가 발생할 때 최대WAL 크기(WAL가 1G까지 쌓이면 체크포인트 발생)
checkpoint_completion_target = 0.9
# 체크포인트 발생 시 최대WAL 크기 (이 크기만큼 로그가 쌓이면 체크포인트 발생)
max_wal_size = 1GB
# 체크포인트 발생 시 최소WAL 크기 (이 크기보다 적으면 체크포인트 발생)
min_wal_size = 80MB

# ─── 로깅 (개발 환경) ──────────────────────────────────────────
log_timezone = 'Asia/Seoul'
# 500ms 이상 걸리는 쿼리만 기록 -> 쿼리 성능 분석에 좋음
log_min_duration_statement = 500
# DDL(테이블 생성/삭제 등)만 기록
log_statement = 'ddl'

# ─── 타임존 ────────────────────────────────────────────────────
timezone = 'Asia/Seoul'
