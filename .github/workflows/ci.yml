name: CI

# compose.yaml이 문법과 변수 치환까지 통과하는지 검사한다.
# 목적은 "서버에서 docker compose up을 했을 때 설정 오류로 멈추는 것"을 머지 전에 막는 것이다.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

# 제목만 바꾼 실행(edited)은 그룹을 따로 둔다. 같은 그룹이면 제목 수정이 진행 중인 빌드를 취소하고,
# 새 실행에서는 빌드 job이 건너뛰어져 검증이 한 번도 끝나지 않는다.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event.action == 'edited' && 'edited' || 'build' }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose 설정 검사
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest

    # .env.example은 비밀값이 비어 있어 ${VAR:?} 검사에 걸리므로, 필수 값만 검사용 더미로 채운다.
    # 셸 환경변수가 --env-file 값보다 우선한다.
    env:
      POSTGRES_PASSWORD: ci-dummy
      MINIO_ROOT_USER: ci-dummy
      MINIO_ROOT_PASSWORD: ci-dummy
      JWT_SECRET: ci-dummy
      FRONTEND_PORT: "18000"
      MINIO_S3_PORT: "18001"

    steps:
      - name: 체크아웃
        uses: actions/checkout@v7

      - name: docker compose config
        run: docker compose --env-file .env.example config -q

  pr-title:
    name: PR 제목 컨벤션 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: '형식 확인 (type: 설명)'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$TITLE" =~ ^(feat|fix|chore|refactor|docs|test|style|perf)(\([a-z0-9-]+\))?:\ .+ ]]; then
            echo "::error::PR 제목이 컨벤션을 따르지 않습니다: \"$TITLE\""
            echo "형식: <type>: <설명>  (예: docs: README 운영 절차 보완)"
            echo "허용 타입: feat, fix, chore, refactor, docs, test, style, perf"
            exit 1
          fi
          echo "OK: $TITLE"
